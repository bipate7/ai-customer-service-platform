<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Customer Service Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="font-inter bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen"
  >
    <!-- Header -->
    <header class="bg-white shadow-sm">
      <div
        class="container mx-auto px-4 py-4 flex justify-between items-center"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center"
          >
            <i class="fas fa-robot text-white text-lg"></i>
          </div>
          <h1 class="text-xl font-bold text-gray-800">AI Customer Support</h1>
        </div>
        <div class="flex items-center space-x-4">
          <button
            id="themeToggle"
            class="p-2 rounded-full hover:bg-gray-100 transition-colors"
          >
            <i class="fas fa-moon text-gray-600"></i>
          </button>
          <button
            id="uploadBtn"
            class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg transition-colors flex items-center space-x-2"
          >
            <i class="fas fa-upload"></i>
            <span>Upload Docs</span>
          </button>
          <button
            id="clearChat"
            class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors flex items-center space-x-2"
          >
            <i class="fas fa-trash-alt"></i>
            <span>Clear Chat</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
      <div class="max-w-4xl mx-auto">
        <!-- Chat Container -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
          <!-- Chat Header -->
          <div
            class="bg-gradient-to-r from-blue-500 to-indigo-600 px-6 py-4 text-white"
          >
            <div class="flex items-center space-x-3">
              <div
                class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center"
              >
                <i class="fas fa-robot"></i>
              </div>
              <div>
                <h3 class="font-semibold">AI Assistant</h3>
                <p class="text-blue-100 text-sm">Online • Ready to help</p>
              </div>
            </div>
          </div>

          <!-- Messages Container -->
          <div id="chatContainer" class="h-96 overflow-y-auto p-6 space-y-6">
            <!-- Welcome Message -->
            <div id="welcomeCard" class="text-center py-8">
              <div
                class="w-16 h-16 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4"
              >
                <i class="fas fa-robot text-white text-2xl"></i>
              </div>
              <h3 class="text-xl font-semibold text-gray-800 mb-2">
                Hello! I'm your AI Assistant
              </h3>
              <p class="text-gray-600 mb-6">How can I help you today?</p>

              <!-- Enhanced Question Tabs -->
              <div class="question-tabs-container max-w-2xl mx-auto">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
                  <button
                    class="question-tab tab-business bg-gradient-to-br from-blue-50 to-blue-100 border-2 border-blue-200 text-blue-700 p-4 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-lg group relative overflow-hidden"
                    data-question="What are your business hours?"
                    data-category="business"
                  >
                    <div
                      class="absolute top-2 right-2 w-3 h-3 bg-blue-400 rounded-full opacity-0 transition-opacity duration-300"
                    ></div>
                    <div
                      class="text-2xl mb-2 group-hover:scale-110 transition-transform duration-300"
                    >
                      🕒
                    </div>
                    <div class="text-sm font-semibold">Business Hours</div>
                    <div
                      class="absolute inset-0 bg-blue-500 rounded-xl opacity-0 group-hover:opacity-5 transition-opacity duration-300"
                    ></div>
                  </button>

                  <button
                    class="question-tab tab-tech bg-gradient-to-br from-green-50 to-green-100 border-2 border-green-200 text-green-700 p-4 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-lg group relative overflow-hidden"
                    data-question="Do you offer technical support?"
                    data-category="tech"
                  >
                    <div
                      class="absolute top-2 right-2 w-3 h-3 bg-green-400 rounded-full opacity-0 transition-opacity duration-300"
                    ></div>
                    <div
                      class="text-2xl mb-2 group-hover:scale-110 transition-transform duration-300"
                    >
                      🔧
                    </div>
                    <div class="text-sm font-semibold">Tech Support</div>
                    <div
                      class="absolute inset-0 bg-green-500 rounded-xl opacity-0 group-hover:opacity-5 transition-opacity duration-300"
                    ></div>
                  </button>

                  <button
                    class="question-tab tab-services bg-gradient-to-br from-purple-50 to-purple-100 border-2 border-purple-200 text-purple-700 p-4 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-lg group relative overflow-hidden"
                    data-question="What services do you provide?"
                    data-category="services"
                  >
                    <div
                      class="absolute top-2 right-2 w-3 h-3 bg-purple-400 rounded-full opacity-0 transition-opacity duration-300"
                    ></div>
                    <div
                      class="text-2xl mb-2 group-hover:scale-110 transition-transform duration-300"
                    >
                      💼
                    </div>
                    <div class="text-sm font-semibold">Our Services</div>
                    <div
                      class="absolute inset-0 bg-purple-500 rounded-xl opacity-0 group-hover:opacity-5 transition-opacity duration-300"
                    ></div>
                  </button>

                  <button
                    class="question-tab tab-contact bg-gradient-to-br from-orange-50 to-orange-100 border-2 border-orange-200 text-orange-700 p-4 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-lg group relative overflow-hidden"
                    data-question="How can I contact customer service?"
                    data-category="contact"
                  >
                    <div
                      class="absolute top-2 right-2 w-3 h-3 bg-orange-400 rounded-full opacity-0 transition-opacity duration-300"
                    ></div>
                    <div
                      class="text-2xl mb-2 group-hover:scale-110 transition-transform duration-300"
                    >
                      📞
                    </div>
                    <div class="text-sm font-semibold">Contact Us</div>
                    <div
                      class="absolute inset-0 bg-orange-500 rounded-xl opacity-0 group-hover:opacity-5 transition-opacity duration-300"
                    ></div>
                  </button>

                  <button
                    class="question-tab tab-upload bg-gradient-to-br from-red-50 to-red-100 border-2 border-red-200 text-red-700 p-4 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-lg group relative overflow-hidden"
                    id="uploadDocBtn"
                    data-category="upload"
                  >
                    <div
                      class="absolute top-2 right-2 w-3 h-3 bg-red-400 rounded-full opacity-0 transition-opacity duration-300"
                    ></div>
                    <div
                      class="text-2xl mb-2 group-hover:scale-110 transition-transform duration-300"
                    >
                      📁
                    </div>
                    <div class="text-sm font-semibold">Upload Document</div>
                    <div
                      class="absolute inset-0 bg-red-500 rounded-xl opacity-0 group-hover:opacity-5 transition-opacity duration-300"
                    ></div>
                  </button>

                  <button
                    class="question-tab tab-refund bg-gradient-to-br from-indigo-50 to-indigo-100 border-2 border-indigo-200 text-indigo-700 p-4 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-lg group relative overflow-hidden"
                    data-question="What is your refund policy?"
                    data-category="refund"
                  >
                    <div
                      class="absolute top-2 right-2 w-3 h-3 bg-indigo-400 rounded-full opacity-0 transition-opacity duration-300"
                    ></div>
                    <div
                      class="text-2xl mb-2 group-hover:scale-110 transition-transform duration-300"
                    >
                      💰
                    </div>
                    <div class="text-sm font-semibold">Refund Policy</div>
                    <div
                      class="absolute inset-0 bg-indigo-500 rounded-xl opacity-0 group-hover:opacity-5 transition-opacity duration-300"
                    ></div>
                  </button>
                </div>
              </div>

              <p class="text-sm text-gray-500">Or type your question below ↓</p>
            </div>
          </div>

          <!-- Quick Question Tabs Above Input -->
          <div
            id="inputQuestionTabs"
            class="border-t border-gray-200 px-6 pt-4 pb-2 hidden"
          >
            <div class="mb-3">
              <p class="text-sm text-gray-500 mb-2 font-medium">
                Quick questions:
              </p>
              <div class="flex flex-wrap gap-2">
                <button
                  class="quick-question-tab quick-business px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-sm transition-all duration-300 hover:scale-105 border-2 border-transparent"
                  data-question="What are your business hours?"
                  data-category="business"
                >
                  <span class="flex items-center space-x-1">
                    <span>🕒</span>
                    <span>Business Hours</span>
                  </span>
                </button>
                <button
                  class="quick-question-tab quick-tech px-3 py-2 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg text-sm transition-all duration-300 hover:scale-105 border-2 border-transparent"
                  data-question="Do you offer technical support?"
                  data-category="tech"
                >
                  <span class="flex items-center space-x-1">
                    <span>🔧</span>
                    <span>Tech Support</span>
                  </span>
                </button>
                <button
                  class="quick-question-tab quick-services px-3 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg text-sm transition-all duration-300 hover:scale-105 border-2 border-transparent"
                  data-question="What services do you provide?"
                  data-category="services"
                >
                  <span class="flex items-center space-x-1">
                    <span>💼</span>
                    <span>Our Services</span>
                  </span>
                </button>
                <button
                  class="quick-question-tab quick-contact px-3 py-2 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-lg text-sm transition-all duration-300 hover:scale-105 border-2 border-transparent"
                  data-question="How can I contact customer service?"
                  data-category="contact"
                >
                  <span class="flex items-center space-x-1">
                    <span>📞</span>
                    <span>Contact Us</span>
                  </span>
                </button>
                <button
                  class="quick-question-tab quick-refund px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-sm transition-all duration-300 hover:scale-105 border-2 border-transparent"
                  data-question="What is your refund policy?"
                  data-category="refund"
                >
                  <span class="flex items-center space-x-1">
                    <span>💰</span>
                    <span>Refund Policy</span>
                  </span>
                </button>
              </div>
            </div>
          </div>

          <!-- Input Area -->
          <div class="border-t border-gray-200 p-6">
            <div class="flex space-x-4">
              <div class="flex-1 relative">
                <textarea
                  id="messageInput"
                  placeholder="Type your message here..."
                  rows="1"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none transition-all duration-300"
                ></textarea>
                <button
                  id="sendButton"
                  class="absolute right-3 bottom-3 p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-all duration-300 hover:scale-110"
                >
                  <i class="fas fa-paper-plane"></i>
                </button>
              </div>
            </div>
            <div class="mt-3 flex justify-between items-center">
              <div class="text-sm text-gray-500">
                <i class="fas fa-shield-alt mr-1"></i>
                Your conversations are secure and private
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
