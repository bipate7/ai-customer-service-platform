<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - GenAI Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-50">
    <!-- Admin Dashboard Code -->
    <div class="min-h-screen">
      <header class="bg-white shadow-sm border-b">
        <div class="container mx-auto px-4 py-3">
          <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">
              <div
                class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center"
              >
                <i class="fas fa-chart-line text-white text-lg"></i>
              </div>
              <div>
                <h1 class="text-xl font-bold text-gray-800">
                  GenAI Support Analytics
                </h1>
                <p class="text-xs text-gray-500">
                  Real-time Customer Support Dashboard
                </p>
              </div>
            </div>
            <div class="flex items-center space-x-4">
              <span
                id="liveIndicator"
                class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium"
              >
                <span
                  class="w-2 h-2 bg-green-500 rounded-full inline-block mr-2 animate-pulse"
                ></span>
                Live
              </span>
              <button
                onclick="window.location.href='../index.html'"
                class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
              >
                Back to Chat
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="container mx-auto px-4 py-8">
        <!-- Analytics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <div class="bg-white rounded-2xl shadow-sm p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-medium text-gray-600">
                  Total Conversations
                </p>
                <p
                  id="totalConversations"
                  class="text-3xl font-bold text-gray-900"
                >
                  0
                </p>
              </div>
              <div
                class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center"
              >
                <i class="fas fa-comments text-blue-600 text-xl"></i>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-medium text-gray-600">
                  Satisfaction Rate
                </p>
                <p
                  id="satisfactionRate"
                  class="text-3xl font-bold text-green-600"
                >
                  0%
                </p>
              </div>
              <div
                class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center"
              >
                <i class="fas fa-thumbs-up text-green-600 text-xl"></i>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-medium text-gray-600">
                  Avg Response Time
                </p>
                <p
                  id="avgResponseTime"
                  class="text-3xl font-bold text-purple-600"
                >
                  0s
                </p>
              </div>
              <div
                class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center"
              >
                <i class="fas fa-clock text-purple-600 text-xl"></i>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-medium text-gray-600">Active Users</p>
                <p id="activeUsers" class="text-3xl font-bold text-orange-600">
                  0
                </p>
              </div>
              <div
                class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center"
              >
                <i class="fas fa-users text-orange-600 text-xl"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <div class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">
              Query Categories
            </h3>
            <canvas id="queryChart" width="400" height="200"></canvas>
          </div>

          <div class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">
              Response Times
            </h3>
            <canvas id="responseTimeChart" width="400" height="200"></canvas>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/firebase.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
